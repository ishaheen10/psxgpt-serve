<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>psxGPT Trace Flow Mock</title>
    <style>
      :root {
        --bg: #f7f4ee;
        --surface: rgba(255, 252, 247, 0.88);
        --surface-2: #fff8ed;
        --ink: #201c17;
        --muted: #70685f;
        --faint: #9e9488;
        --line: rgba(87, 68, 44, 0.14);
        --line-strong: rgba(38, 106, 140, 0.34);
        --blue: #176b91;
        --blue-soft: #e2f2f7;
        --green: #24755d;
        --green-soft: #e1f3eb;
        --amber: #9b6218;
        --amber-soft: #f8e4c0;
        --red: #a23a2b;
        --red-soft: #f8dfda;
        --shadow: 0 18px 60px rgba(55, 39, 19, 0.1);
        --radius: 22px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 10% 0%, rgba(255, 255, 255, 0.9), transparent 34%),
          linear-gradient(180deg, #fbf8f2 0%, var(--bg) 100%);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      main {
        width: min(1180px, calc(100vw - 28px));
        margin: 24px auto;
      }

      .shell {
        display: grid;
        grid-template-columns: 310px minmax(0, 1fr);
        gap: 18px;
      }

      .sidebar,
      .stage-panel {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .sidebar {
        position: sticky;
        top: 20px;
        align-self: start;
        overflow: hidden;
      }

      .sidebar-head {
        padding: 18px 18px 12px;
        border-bottom: 1px solid var(--line);
      }

      .kicker {
        color: var(--blue);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        margin-top: 6px;
        font-size: 21px;
        line-height: 1.18;
      }

      .query {
        margin-top: 9px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .run-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 12px 18px 4px;
      }

      .run-stat {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.54);
        padding: 10px;
      }

      .run-stat b {
        display: block;
        font-size: 16px;
      }

      .run-stat span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
      }

      .steps {
        padding: 10px;
      }

      .step {
        width: 100%;
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        border: 1px solid transparent;
        border-radius: 16px;
        background: transparent;
        padding: 10px;
        color: var(--muted);
        text-align: left;
        cursor: pointer;
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }

      .step + .step {
        margin-top: 4px;
      }

      .step:hover {
        background: rgba(255, 255, 255, 0.58);
      }

      .step.active {
        border-color: var(--line-strong);
        background: #eef8fb;
        color: var(--ink);
      }

      .step:active {
        transform: scale(0.99);
      }

      .num {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #eee4d6;
        color: var(--amber);
        font-size: 13px;
        font-weight: 850;
      }

      .active .num {
        background: var(--blue);
        color: white;
      }

      .step strong {
        display: block;
        overflow: hidden;
        color: inherit;
        font-size: 14px;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .step small {
        display: block;
        margin-top: 3px;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .count {
        min-width: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.76);
        padding: 5px 8px;
        color: var(--blue);
        font-size: 12px;
        font-weight: 850;
        text-align: center;
      }

      .stage-panel {
        min-height: 720px;
        overflow: hidden;
      }

      .stage-top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: start;
        padding: 22px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(255, 252, 247, 0.98), rgba(255, 247, 234, 0.92));
      }

      .stage-top h2 {
        margin-top: 5px;
        font-size: 28px;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .stage-top p {
        margin-top: 9px;
        max-width: 720px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .stage-actions {
        display: flex;
        gap: 8px;
      }

      .icon-btn,
      .pill-btn {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
        color: var(--ink);
        cursor: pointer;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        font-size: 17px;
      }

      .pill-btn {
        min-height: 38px;
        padding: 0 13px;
        font-size: 13px;
        font-weight: 750;
      }

      .content {
        display: grid;
        gap: 12px;
        padding: 18px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.66);
        overflow: hidden;
      }

      .card summary {
        list-style: none;
        cursor: pointer;
      }

      .card summary::-webkit-details-marker {
        display: none;
      }

      .card-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 14px;
      }

      .card-title {
        min-width: 0;
      }

      .card-title strong {
        display: block;
        overflow: hidden;
        color: var(--ink);
        font-size: 15px;
        line-height: 1.28;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .card-title span {
        display: block;
        margin-top: 4px;
        overflow: hidden;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
      }

      .badge {
        border-radius: 999px;
        padding: 5px 8px;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      .blue {
        background: var(--blue-soft);
        color: var(--blue);
      }

      .green {
        background: var(--green-soft);
        color: var(--green);
      }

      .amber {
        background: var(--amber-soft);
        color: var(--amber);
      }

      .red {
        background: var(--red-soft);
        color: var(--red);
      }

      .body {
        display: none;
        border-top: 1px solid var(--line);
        padding: 14px;
      }

      details[open] > .body {
        display: block;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px;
      }

      .soft-box {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fffaf3;
        padding: 12px;
      }

      .soft-box h3 {
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .soft-box p,
      .soft-box li {
        color: var(--ink);
        font-size: 13px;
        line-height: 1.45;
      }

      ul {
        margin: 0;
        padding-left: 18px;
      }

      pre {
        max-height: 240px;
        margin: 0;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #231f1a;
        color: #f8efe2;
        padding: 12px;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fffaf3;
        font-size: 13px;
      }

      .table th,
      .table td {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }

      .table th {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .table tr:last-child td {
        border-bottom: 0;
      }

      .source-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 13px;
      }

      .source-url {
        margin-top: 8px;
        overflow: hidden;
        border-radius: 10px;
        background: #f3eadb;
        padding: 7px 8px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .open-link {
        display: inline-grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: white;
        color: var(--blue);
        font-weight: 900;
        text-decoration: none;
      }

      .answer {
        border-left: 3px solid var(--blue);
        border-radius: 12px;
        background: #f2f9fb;
        padding: 13px;
        color: #1d3f4c;
        font-size: 14px;
        line-height: 1.55;
      }

      .raw-toggle {
        margin-top: 12px;
      }

      @media (max-width: 820px) {
        main {
          width: min(100vw - 20px, 720px);
          margin: 10px auto;
        }

        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
          border-radius: 18px;
        }

        .steps {
          display: grid;
          grid-template-columns: repeat(5, minmax(72px, 1fr));
          gap: 6px;
          overflow-x: auto;
          padding: 10px;
        }

        .step {
          grid-template-columns: 1fr;
          gap: 6px;
          min-width: 84px;
          justify-items: start;
        }

        .step small,
        .count {
          display: none;
        }

        .stage-top,
        .card-head,
        .source-row {
          grid-template-columns: 1fr;
        }

        .stage-top h2 {
          font-size: 23px;
        }

        .grid-2 {
          grid-template-columns: 1fr;
        }

        .meta {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="shell">
        <aside class="sidebar">
          <div class="sidebar-head">
            <div class="kicker">Query trace</div>
            <h1>HALEON latest results and margins</h1>
            <p class="query">Show revenue, gross margin, and net profit trend for HALEON with sources.</p>
          </div>
          <div class="run-strip">
            <div class="run-stat"><b>1.8s</b><span>duration</span></div>
            <div class="run-stat"><b>3</b><span>lanes</span></div>
            <div class="run-stat"><b>5</b><span>sources</span></div>
          </div>
          <nav class="steps" aria-label="Trace stages"></nav>
        </aside>

        <section class="stage-panel">
          <header class="stage-top">
            <div>
              <div class="kicker" id="stage-kicker"></div>
              <h2 id="stage-title"></h2>
              <p id="stage-copy"></p>
            </div>
            <div class="stage-actions">
              <button class="pill-btn" id="raw-toggle" type="button">Raw</button>
              <button class="icon-btn" id="next-stage" type="button" aria-label="Next stage">→</button>
            </div>
          </header>
          <div class="content" id="stage-content"></div>
        </section>
      </div>
    </main>

    <script>
      const trace = {
        plan: {
          title: "Plan",
          note: "Typed asks",
          copy: "The system turns the user query into structured asks and flags unresolved scope before retrieval starts.",
          count: 2,
          cards: [
            {
              title: "Router ask",
              subtitle: "financials · HALEON · annual periods",
              badges: ["router", "typed"],
              rows: [
                ["ticker", "HALEON"],
                ["concepts", "revenue, gross_margin, net_profit"],
                ["period", "latest annual + prior years"],
              ],
              raw: {
                table: "financial_statements",
                tickers: ["HALEON"],
                concepts: ["revenue", "gross margin", "net profit"],
                period: "latest annual trend",
              },
            },
            {
              title: "Trace audit",
              subtitle: "No unresolved ticker or missing-scope flag detected",
              badges: ["clean"],
              rows: [
                ["ticker resolution", "HALEON matched"],
                ["scope", "company financial trend"],
                ["eval hint", "none"],
              ],
              raw: { flags: [], evalIdeas: [] },
            },
          ],
        },
        retrieve: {
          title: "Retrieve",
          note: "Evidence lanes",
          copy: "Each lane records the data route used: table, variable, SQL/tool calls, coverage, and candidate previews. Narrative retrieval is BM25-first because the indexed search text is already source-shaped, fast, inspectable, and tunable without adding an embedding dependency.",
          count: 4,
          cards: [
            {
              title: "financial_statement_rows",
              subtitle: "Fetched annual income statement rows for HALEON",
              badges: ["run_sql", "12 rows"],
              rows: [
                ["table", "financial_statement_rows"],
                ["variable", "haleon_income_statement"],
                ["coverage", "2022, 2023, 2024"],
              ],
              code: "SELECT ticker, period_end, line_item, value\nFROM financial_statement_rows\nWHERE ticker = 'HALEON'\n  AND section = 'income_statement'\nORDER BY period_end DESC;",
              raw: { lane_variable: "haleon_income_statement", model: "deterministic-sql", provenance_ids: [72911, 72910] },
            },
            {
              title: "BM25 retrieval choice",
              subtitle: "Use lexical FTS first; add embeddings only when failure evidence justifies it",
              badges: ["BM25", "FTS", "no embedding dependency"],
              rows: [
                ["why BM25", "fast, inspectable, source-shaped search text"],
                ["why not embeddings first", "another model dependency and harder-to-debug scoring"],
                ["current discipline", "tune MATCH terms, corpus text, and ranking before adding vectors"],
              ],
              code: "SELECT page_id, ticker, filing_period, page_number,\n       bm25(filings_fts_new) AS score\nFROM filings_fts_new\nWHERE filings_fts_new MATCH 'HALEON revenue gross margin net profit'\nORDER BY score\nLIMIT 12;",
              raw: {
                retrieval_mode: "BM25/SQLite FTS",
                embedding_mode: "not used",
                rationale: "Prefer observable lexical retrieval while quality is good enough and ranking can be tuned directly.",
              },
            },
            {
              title: "source_pages",
              subtitle: "Retrieved annual report pages for surfaced evidence",
              badges: ["PDF", "5 pages"],
              rows: [
                ["candidate pages", "p.26, p.27, p.29, p.92"],
                ["source kind", "annual report"],
                ["selected for analyst", "yes"],
              ],
              raw: { candidate_preview: ["HALEON 2024 p.27", "HALEON 2024 p.92"], narrative_ids: [72911, 72967] },
            },
            {
              title: "macro context",
              subtitle: "No macro route needed for this query",
              badges: ["skipped"],
              rows: [
                ["reason", "Company financial trend was answerable from filings"],
                ["fallback", "not used"],
              ],
              raw: { skipped: true, reason: "not required by query intent" },
            },
          ],
        },
        compute: {
          title: "Compute",
          note: "Tables + artifacts",
          copy: "Structured data and calculations are presented as artifacts first. SQL and full JSON stay available, but they are not the first thing the user has to parse.",
          count: 2,
          cards: [
            {
              title: "Computed table",
              subtitle: "Revenue, gross margin, net profit",
              badges: ["3 rows", "CSV"],
              table: [
                ["Period", "Revenue", "Gross margin", "Net profit"],
                ["2024", "102.4bn", "33.8%", "16.1bn"],
                ["2023", "91.7bn", "32.2%", "13.4bn"],
                ["2022", "82.5bn", "30.9%", "10.8bn"],
              ],
              raw: { title: "HALEON financial trend", row_count: 3, coverage: { selected_tickers: ["HALEON"] } },
            },
            {
              title: "Execution artifact",
              subtitle: "Derived margin calculations from retrieved rows",
              badges: ["artifact", "deterministic"],
              rows: [
                ["gross margin", "gross_profit / revenue"],
                ["net margin", "net_profit / revenue"],
                ["provenance", "financial rows + source pages"],
              ],
              raw: { variable: "haleon_margin_trend", table: "financial_statement_rows", resultSummary: "Computed 3 annual periods" },
            },
          ],
        },
        write: {
          title: "Write",
          note: "Answer synthesis",
          copy: "The final answer is intentionally behind the Write stage. This keeps trace review focused on process until the user asks to inspect the generated output.",
          count: 1,
          cards: [
            {
              title: "Final answer",
              subtitle: "Generated from computed table and cited source pages",
              badges: ["answer", "markdown"],
              answer:
                "HALEON's latest annual results show revenue growth with margin improvement. Revenue increased across the displayed annual periods, while gross margin rose from 30.9% to 33.8%. Net profit also increased, supported by stronger operating performance. The answer cites the annual report pages surfaced in the Verify step.",
              raw: { model: "analyst", answer_text: "markdown answer", computed_tables: 1, sources: 5 },
            },
            {
              title: "Analyst context",
              subtitle: "Collapsed by default: prompt, computed tables, source pack",
              badges: ["debug"],
              rows: [
                ["computed tables", "1"],
                ["execution artifacts", "2"],
                ["source pages", "5"],
              ],
              raw: { analyst_user_message_text: "tables + artifacts + sources", system_prompt_text: "analyst instructions" },
            },
          ],
        },
        verify: {
          title: "Verify",
          note: "Source pages",
          copy: "Sources should read as citations first: company, period, page, kind, and open action. IDs and long URLs remain inspectable without dominating the trace.",
          count: 5,
          cards: [
            {
              title: "HALEON annual 2024 · page 27",
              subtitle: "Annual report page selected for final answer",
              badges: ["final", "PDF", "p.27"],
              source: "https://source.psxgpt.com/PDF_PAGES/HALEON/2024/page-27.pdf",
              rows: [
                ["source_id", "72911"],
                ["selection_stage", "final_sources"],
                ["selected_for_analyst", "yes"],
              ],
              raw: { id: 72911, ticker: "HALEON", page_number: 27, source_kind: "annual_report" },
            },
            {
              title: "HALEON annual 2024 · page 92",
              subtitle: "Annual report note page selected for analyst context",
              badges: ["final", "PDF", "p.92"],
              source: "https://source.psxgpt.com/PDF_PAGES/HALEON/2024/page-92.pdf",
              rows: [
                ["source_id", "72967"],
                ["selection_stage", "final_sources"],
                ["selected_for_panel", "yes"],
              ],
              raw: { id: 72967, ticker: "HALEON", page_number: 92, source_kind: "annual_report" },
            },
            {
              title: "HALEON annual 2024 · page 26",
              subtitle: "Nearby statement page retained in source log",
              badges: ["PDF", "p.26"],
              source: "https://source.psxgpt.com/PDF_PAGES/HALEON/2024/page-26.pdf",
              rows: [
                ["source_id", "72910"],
                ["selection_stage", "retrieval"],
                ["selected_for_analyst", "no"],
              ],
              raw: { id: 72910, ticker: "HALEON", page_number: 26, source_kind: "annual_report" },
            },
          ],
        },
      };

      const order = ["plan", "retrieve", "compute", "write", "verify"];
      let active = "plan";
      let showRaw = false;

      const steps = document.querySelector(".steps");
      const content = document.getElementById("stage-content");
      const title = document.getElementById("stage-title");
      const kicker = document.getElementById("stage-kicker");
      const copy = document.getElementById("stage-copy");
      const rawToggle = document.getElementById("raw-toggle");

      function badgeClass(label) {
        if (/clean|final|answer|deterministic/i.test(label)) return "green";
        if (/skipped|debug/i.test(label)) return "amber";
        if (/failed|missing/i.test(label)) return "red";
        return "blue";
      }

      function renderSteps() {
        steps.innerHTML = order
          .map((id, index) => {
            const stage = trace[id];
            return `<button class="step ${id === active ? "active" : ""}" data-stage="${id}" type="button">
              <span class="num">${index + 1}</span>
              <span><strong>${stage.title}</strong><small>${stage.note}</small></span>
              <span class="count">${stage.count}</span>
            </button>`;
          })
          .join("");
      }

      function renderRows(rows) {
        if (!rows) return "";
        return `<div class="soft-box"><h3>Trace fields</h3><table class="table"><tbody>${rows
          .map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`)
          .join("")}</tbody></table></div>`;
      }

      function renderTable(table) {
        if (!table) return "";
        const [head, ...rows] = table;
        return `<table class="table"><thead><tr>${head.map((cell) => `<th>${cell}</th>`).join("")}</tr></thead><tbody>${rows
          .map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`)
          .join("")}</tbody></table>`;
      }

      function renderCard(card, index) {
        const badges = card.badges.map((b) => `<span class="badge ${badgeClass(b)}">${b}</span>`).join("");
        const raw = showRaw ? `<div class="raw-toggle"><pre>${JSON.stringify(card.raw || {}, null, 2)}</pre></div>` : "";
        const code = card.code ? `<div class="soft-box"><h3>SQL</h3><pre>${card.code}</pre></div>` : "";
        const rows = renderRows(card.rows);
        const table = renderTable(card.table);
        const answer = card.answer ? `<div class="answer">${card.answer}</div>` : "";
        const source = card.source
          ? `<div class="source-row"><div><div class="source-url">${card.source}</div></div><a class="open-link" href="${card.source}" target="_blank" rel="noreferrer">↗</a></div>`
          : "";
        const body = [answer, table, `<div class="grid-2">${rows}${code}</div>`, source, raw].filter(Boolean).join("");
        return `<details class="card" ${index === 0 ? "open" : ""}>
          <summary>
            <div class="card-head">
              <div class="card-title"><strong>${card.title}</strong><span>${card.subtitle}</span></div>
              <div class="meta">${badges}</div>
            </div>
          </summary>
          <div class="body">${body}</div>
        </details>`;
      }

      function renderStage() {
        const stage = trace[active];
        const activeIndex = order.indexOf(active);
        kicker.textContent = `Step ${activeIndex + 1} · ${stage.title}`;
        title.textContent = stage.title;
        copy.textContent = stage.copy;
        rawToggle.textContent = showRaw ? "Hide raw" : "Raw";
        content.innerHTML = stage.cards.map(renderCard).join("");
        renderSteps();
      }

      steps.addEventListener("click", (event) => {
        const button = event.target.closest("[data-stage]");
        if (!button) return;
        active = button.dataset.stage;
        renderStage();
      });

      rawToggle.addEventListener("click", () => {
        showRaw = !showRaw;
        renderStage();
      });

      document.getElementById("next-stage").addEventListener("click", () => {
        active = order[(order.indexOf(active) + 1) % order.length];
        renderStage();
      });

      renderStage();
    </script>
  </body>
</html>
